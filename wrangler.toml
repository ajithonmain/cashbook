name = "cashbook"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# `npm run setup` fills in database_name / database_id for your own Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "cashbook"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
